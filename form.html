<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review by selecting a product, rating it, and sharing your experience.">

    <meta name="author" content="Henry Tibenkana">

    <title>Product Review</title>
    
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>  
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>
                <legend>Product Information</legend>

                <label for="product">
                    Product Name
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>
                    Overall Rating
                </label>

                <div class="rating">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span>☆</span>
                        <span class="rating-number">1</span>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        <span>☆</span>
                        <span class="rating-number">2</span>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        <span>☆</span>
                        <span class="rating-number">3</span>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        <span>☆</span>
                        <span class="rating-number">4</span>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        <span>☆</span>
                        <span class="rating-number">5</span>
                    </label>
                </div>

                <label for="installDate">
                    Date of Installation
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </fieldset>

            <fieldset>
                <legend>Product Features</legend>

                <p>Useful Features</p>

                <label for="durable">
                    <input type="checkbox" id="durable" name="features" value="Durability">
                    Durability
                </label>

                <label for="easy">
                    <input type="checkbox" id="easy" name="features" value="Easy to use">
                    Easy to use
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

            </fieldset>

            <fieldset>
                <legend>Your Review</legend>

                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6"
                    placeholder="Write your review here..."></textarea>

                <label for="userName">
                    User Name
                </label>

                <input type="text" id="userName" name="userName"
                    autocomplete="name">

            </fieldset>

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Henry Tibenkana | Uganda
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
