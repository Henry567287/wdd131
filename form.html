<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review by selecting a product, rating it, and sharing your experience.">

    <meta name="author" content="Henry Tibenkana">

    <title>Product Review</title>
    
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>  
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html">

    <fieldset>

        <label for="product">Product Name</label>

        <select id="product" name="product" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>

        <label>Overall Rating</label>

        <div class="rating">

            <label for="rating1">
                <span>★</span>
                <input type="radio" id="rating1" name="rating" value="1" required>
            </label>

            <label for="rating2">
                <span>★★</span>
                <input type="radio" id="rating2" name="rating" value="2" required>
            </label>

            <label for="rating3">
                <span>★★★</span>
                <input type="radio" id="rating3" name="rating" value="3" required>
            </label>

            <label for="rating4">
                <span>★★★★</span>
                <input type="radio" id="rating4" name="rating" value="4" required>
            </label>

            <label for="rating5">
                <span>★★★★★</span>
                <input type="radio" id="rating5" name="rating" value="5" required>
            </label>

        </div>

        <label for="installDate">
            Date of Installation
        </label>

        <input type="date" id="installDate" name="installDate" required>

    </fieldset>

    <fieldset>

        <p class="field-title">
            Which features did you find useful in the product?
        </p>

        <p><em>(Check all that apply)</em></p>

        <!-- checkboxes here -->

    </fieldset>

    <fieldset>

        <label for="review">
            Written Review
            <span class="optional">(Optional)</span>
        </label>

        <textarea id="review" name="review"></textarea>

        <label for="userName">
            Your Name
            <span class="optional">(Optional)</span>
        </label>

        <input type="text" id="userName" name="userName">

    </fieldset>

    <input type="submit" value="Post Review">

</form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Henry Tibenkana | Uganda
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
